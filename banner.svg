<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A101F"/>
      <stop offset="100%" stop-color="#10192E"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>

  <path d="M0,180 C 200,140 400,200 600,170 C 800,140 1000,190 1200,160 L1200,220 L0,220 Z" fill="url(#wave)"/>
  <path d="M0,190 C 220,160 420,210 620,185 C 820,160 1000,200 1200,175 L1200,220 L0,220 Z" fill="#22D3EE" fill-opacity="0.08"/>

  <text x="60" y="95" font-family="Fira Code, Consolas, monospace" font-size="46" font-weight="700" fill="#F8FAFC">
    Mohamed Saad
    <animate attributeName="opacity" from="0" to="1" dur="1.1s" fill="freeze"/>
  </text>

  <text x="60" y="135" font-family="Fira Code, Consolas, monospace" font-size="18" fill="#94A3B8">
    AI &amp; Data Enthusiast &#183; Full-Stack Learner &#183; Future Data Engineer
    <animate attributeName="opacity" from="0" to="1" dur="1.6s" begin="0.3s" fill="freeze"/>
  </text>

  <circle cx="1130" cy="45" r="5" fill="#10B981">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="1080" y="51" font-family="Fira Code, Consolas, monospace" font-size="13" fill="#10B981" text-anchor="end">LIVE</text>
</svg>
